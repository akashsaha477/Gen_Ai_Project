# PTB-XL pretraining arm (docs/DECISIONS.md A12).
# Only the pretraining stage is configured here. The representation, the model and the fine-tuning
# budget (seeds, learning-rate grid, epochs, patience) come from the Module 1 config each variant
# points to, so both arms are trained exactly like a Module 1 variant.
phase: 2
module: 3
pretrain:
  lr: 1.0e-3
  max_epochs: 30
  patience: 5
  batch_size: 256
  weight_decay: 0.01
