[project]
name = "ecgaug"
version = "0.1.0"
description = "Rare-arrhythmia detection with generative ECG augmentation (MIT-BIH, inter-patient protocol)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "scikit-learn",
    "matplotlib",
    "wfdb",
    "pyyaml",
    "torch",
    "imbalanced-learn",
    "captum",
    "dtaidistance",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecgaug"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
